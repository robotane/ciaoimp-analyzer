site_name: CiaoImp Analyzer
site_description: Pipeline portable pour la normalisation de contrats CiaoMoka, l'analyse CasLog et l'exécution TNF.
site_author: CiaoImp project
docs_dir: docs
site_dir: site
use_directory_urls: false

theme:
  name: material
  language: fr
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: blue

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            members_order: source

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true

nav:
  - Accueil: index.md
  - Prérequis et démarrage: prerequisites.md
  - Architecture: architecture.md
  - Guide pipeline: pipeline-guide.md
  - API:
      - Orchestration: api/pipeline.md
      - Transformations: api/transformations.md
      - Annotation: api/annotation.md
      - Résultats: api/results.md
